services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asian-health-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asian_health_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahh_secure_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asian_health_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asian-health-hub-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4000}:3000"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ahh_secure_pass_2026}@db:5432/${POSTGRES_DB:-asian_health_hub}
    volumes:
      - ./public/uploads:/app/public/uploads

  openclaw-bot:
    build:
      context: .
      dockerfile: openclaw/Dockerfile
    container_name: asian-health-hub-openclaw
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - openclaw/.env
    environment:
      - OPENCLAW_PREVIEW_BASE_URL=http://web:3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ahh_secure_pass_2026}@db:5432/${POSTGRES_DB:-asian_health_hub}
      # Website edits happen in disposable clones of the repository kept here (then opened as Pull Requests).
      - OPENCLAW_WORK_DIR=/work
    working_dir: /app/openclaw
    volumes:
      - .:/app
      - openclaw-work:/work
      # NOTE: the Docker socket is deliberately NOT mounted (it is root on the server). The bot no longer edits
      # or publishes the live checkout: edits become Pull Requests. If you want the bot to redeploy after a merge,
      # opt in explicitly with docker-compose.deploy.yml (see that file).
    command: ["python", "telegram_bot.py"]

volumes:
  pgdata:
  openclaw-work:

