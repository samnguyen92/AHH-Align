services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: asian-health-hub-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local

  openclaw-bot:
    build:
      context: .
      dockerfile: openclaw/Dockerfile
    container_name: asian-health-hub-openclaw
    restart: unless-stopped
    env_file:
      - openclaw/.env
    environment:
      - OPENCLAW_PREVIEW_BASE_URL=http://web:3000
    working_dir: /app/openclaw
    volumes:
      # Mount full workspace so the Web-Dev & SEO Agent can edit src/, run git push, and trigger live rebuilds on VPS.
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "telegram_bot.py"]
