services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asian-health-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asian_health_hub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahh_secure_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asian_health_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:3000}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-local-anon-key}
    container_name: asian-health-hub-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ahh_secure_pass_2026}@db:5432/${POSTGRES_DB:-asian_health_hub}
    volumes:
      - ./public/uploads:/app/public/uploads

  openclaw-bot:
    build:
      context: .
      dockerfile: openclaw/Dockerfile
    container_name: asian-health-hub-openclaw
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - openclaw/.env
    environment:
      - OPENCLAW_PREVIEW_BASE_URL=http://web:3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ahh_secure_pass_2026}@db:5432/${POSTGRES_DB:-asian_health_hub}
    working_dir: /app/openclaw
    volumes:
      # Mount full workspace so the Web-Dev & SEO Agent can edit src/, run git push, and trigger live rebuilds on VPS.
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "telegram_bot.py"]

volumes:
  pgdata:

